name: Build v3pb Packages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Void Linux environment and build
        run: |
          # Install Docker tools if needed, or run void-packages via a docker container cleanly
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            ghcr.io/void-linux/void-linux:latest-full-x86_64 \
            bash -c "
              apt-get update && apt-get install -y git curl xbps make gcc || true
              xbps-install -Sy git curl xbps make-devel gcc || true
              
              cd /workspace
              git clone https://github.com/void-linux/void-packages.git
              cd void-packages
              ./xbps-src binary-bootstrap
              
              cp -r /workspace/srcpkgs/* srcpkgs/
              echo XBPS_ALLOW_RESTRICTED=yes >> etc/conf
              
              ./xbps-src pkg v3pb-ladybird-bin
              
              mkdir -p /workspace/binpkgs
              find hostdir/binpkgs -name '*.xbps' -exec cp {} /workspace/binpkgs/ \;
            "

      - name: Generate Repository Index
        run: |
          # Install xbps tools on the host runner to index the packages
          sudo apt-get update && sudo apt-get install -y xbps
          xbps-rindex -d binpkgs/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v3pb-binaries
          path: binpkgs/