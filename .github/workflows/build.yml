name: Build v3pb Packages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up and build package natively
        run: |
          # Install dependencies on the host Ubuntu runner
          sudo apt-get update
          sudo apt-get install -y git curl build-essential m4 tar wget bzip2 xz-utils libarchive-tools xbps

          # Clone official void-packages infrastructure
          git clone https://github.com/void-linux/void-packages.git
          
          # Copy custom package template into the tree
          cp -r srcpkgs/* void-packages/srcpkgs/

          cd void-packages
          
          # Initialize xbps-src
          ./xbps-src binary-bootstrap

          # Allow restricted packages if needed
          echo XBPS_ALLOW_RESTRICTED=yes >> etc/conf

          # Build the package
          ./xbps-src pkg v3pb-ladybird-bin

      - name: Generate Repository Index
        run: |
          mkdir -p binpkgs
          find void-packages/hostdir/binpkgs -name "*.xbps" -exec cp {} binpkgs/ \;
          
          # Index the repository
          xbps-rindex -d binpkgs/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v3pb-binaries
          path: binpkgs/