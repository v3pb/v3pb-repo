name: Build v3pb Packages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Index in Void Linux Container
        uses: docker://ghcr.io/void-linux/void-linux:latest-full-x86_64
        with:
          args: >-
            sh -c "
            xbps-install -Syu xbps &&
            xbps-install -Sy git curl make-devel gcc tar findutils &&
            git clone https://github.com/void-linux/void-packages.git &&
            cp -r srcpkgs/* void-packages/srcpkgs/ &&
            cd void-packages &&
            ./xbps-src binary-bootstrap &&
            echo XBPS_ALLOW_RESTRICTED=yes >> etc/conf &&
            ./xbps-src pkg v3pb-ladybird-bin &&
            mkdir -p /github/workspace/binpkgs &&
            find hostdir/binpkgs -name '*.xbps' -exec cp {} /github/workspace/binpkgs/ \; &&
            cd /github/workspace &&
            xbps-rindex -d binpkgs/
            "

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v3pb-binaries
          path: binpkgs/