name: Build Postman Package
on:
  schedule:
    - cron: '0 12 * * *'   # once a day
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.check.outputs.new_version }}
      new_etag: ${{ steps.check.outputs.new_etag }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          HEADERS=$(curl -sI "https://dl.pstmn.io/download/latest/linux64")
          ETAG=$(echo "$HEADERS" | grep -i '^etag:' | tr -d '\r' | awk '{print $2}' | tr -d '"')
          LASTMOD=$(echo "$HEADERS" | grep -i '^last-modified:' | tr -d '\r' | cut -d' ' -f2-)
          LATEST_VERSION=$(date -d "$LASTMOD" +%Y.%m.%d)
          CURRENT_ETAG=$(cat ETAG 2>/dev/null || echo "none")

          echo "new_version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_etag=$ETAG" >> "$GITHUB_OUTPUT"

          if [ "$ETAG" != "$CURRENT_ETAG" ] && [ -n "$ETAG" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Postman and stage package contents
        run: |
          VERSION="${{ needs.check-version.outputs.new_version }}"
          curl -sL "https://dl.pstmn.io/download/latest/linux64" -o postman.tar.gz
          ls -la postman.tar.gz
          mkdir -p pkg-staging/usr/lib
          tar -xzf postman.tar.gz -C pkg-staging/usr/lib
          echo "--- Contents of pkg-staging/usr/lib after extract ---"
          ls -la pkg-staging/usr/lib
          mv pkg-staging/usr/lib/Postman pkg-staging/usr/lib/postman
          mkdir -p pkg-staging/usr/bin
          ln -sf ../lib/postman/Postman pkg-staging/usr/bin/postman
          echo "--- Full pkg-staging tree ---"
          find pkg-staging -maxdepth 4
          echo "--- Host PWD ---"
          pwd

      - name: Build Void package
        run: |
          VERSION="${{ needs.check-version.outputs.new_version }}"
          docker run --rm -v "${PWD}:/github/workspace" -w /github/workspace \
            ghcr.io/void-linux/void-linux:latest-full-x86_64 sh -c "
            echo '--- Inside container: /github/workspace ---' &&
            pwd &&
            ls -la &&
            echo '--- Inside container: pkg-staging ---' &&
            ls -la pkg-staging || echo 'pkg-staging NOT FOUND from inside container' &&
            xbps-install -Syu xbps &&
            mkdir -p binpkgs &&
            xbps-create -A x86_64 \
              -n 'postman-bin-${VERSION}_1' \
              -s 'API platform for building and testing APIs' \
              -m 'v3pb <147268184+v3pb@users.noreply.github.com>' \
              -l 'proprietary' \
              pkg-staging &&
            mv *.xbps binpkgs/ &&
            xbps-rindex -a binpkgs/*.xbps
          "

      - name: Record new version
        run: |
          echo "${{ needs.check-version.outputs.new_version }}" > VERSION
          echo "${{ needs.check-version.outputs.new_etag }}" > ETAG

      - name: Commit version bump
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add VERSION ETAG
          git commit -m "Postman: bump to ${{ needs.check-version.outputs.new_version }}"
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./binpkgs
          keep_files: true