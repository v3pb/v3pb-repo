name: Build v3pb Packages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Package Directly
        run: |
          # Create working directory structure for the package
          mkdir -p pkg-staging/usr/bin
          
          # Copy your binary into the staging directory (ensure your file exists in the repo)
          # cp path/to/binary pkg-staging/usr/bin/ladybird

          # Write the required XBPS metadata file
          cat << 'EOF' > pkg-staging.plist
          package=v3pb-ladybird-bin
          version=2026.07.05
          revision=1
          arch=x86_64
          maintainer=v3pb <147268184+v3pb@users.noreply.github.com>
          homepage=https://ladybird.org/
          changelog=https://ladybird.org/
          short_desc="Truly independent web browser (Binary)"
          license=BSD-2-Clause
          EOF

          # Download a static pre-compiled xbps-create/rindex utility or use container if needed, 
          # Or let's generate the index using a lightweight container approach for the tools.
          docker run --rm -v "${PWD}:/github/workspace" -w /github/workspace ghcr.io/void-linux/void-linux:latest-full-x86_64 sh -c "
            xbps-install -Sy xbps &&
            mkdir -p binpkgs &&
            xbps-create -A x86_64 -p pkg-staging.plist -r pkg-staging binpkgs/ &&
            xbps-rindex -d binpkgs/
          "

      - name: Deploy Binaries to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./binpkgs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v3pb-binaries
          path: binpkgs/