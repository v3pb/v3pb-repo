name: Build v3pb Packages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Index in Void Linux Container
        uses: docker://ghcr.io/void-linux/void-linux:latest-full-x86_64
        with:
          args: >-
            sh -c "
            xbps-install -Syu xbps &&
            xbps-install -Sy bash git curl make gcc tar findutils shadow &&
            useradd -m builder &&
            git clone https://github.com/void-linux/void-packages.git &&
            cp -r srcpkgs/* void-packages/srcpkgs/ &&
            chown -R builder:builder void-packages &&
            su builder -c 'cd void-packages && ./xbps-src binary-bootstrap' &&
            su builder -c 'cd void-packages && echo XBPS_ALLOW_RESTRICTED=yes >> etc/conf' &&
            su builder -c 'cd void-packages && ./xbps-src pkg v3pb-ladybird-bin' &&
            mkdir -p /github/workspace/binpkgs &&
            find void-packages/hostdir/binpkgs -name '*.xbps' -exec cp {} /github/workspace/binpkgs/ \; &&
            xbps-rindex -d /github/workspace/binpkgs/
            "

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v3pb-binaries
          path: binpkgs/