name: Build v3pb Packages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Package Directly
        run: |
          # Install xbps tools on the host runner to build the package archive
          sudo apt-get update && sudo apt-get install -y xbps

          # Create working directory structure for the package
          mkdir -p pkg-staging/usr/bin
          
          # (Assuming your source contains the pre-compiled binary or you download it here)
          # Copy your binary into the staging directory
          # cp path/to/binary pkg-staging/usr/bin/ladybird

          # Generate the XBPS control metadata and build the package
          mkdir -p pkg-staging/control
          
          # Write the required XBPS metadata file
          cat << 'EOF' > pkg-staging.plist
          package=v3pb-ladybird-bin
          version=2026.07.05
          revision=1
          arch=x86_64
          maintainer=v3pb <147268184+v3pb@users.noreply.github.com>
          homepage=https://ladybird.org/
          changelog=https://ladybird.org/
          short_desc="Truly independent web browser (Binary)"
          license=BSD-2-Clause
          EOF

          # Build the .xbps file using xbps-create
          mkdir -p binpkgs
          xbps-create -A x86_64 -p pkg-staging.plist -r pkg-staging binpkgs/

          # Index the repository
          xbps-rindex -d binpkgs/

      - name: Deploy Binaries to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./binpkgs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v3pb-binaries
          path: binpkgs/